<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>demo-agent · 品牌素材</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae3;color:#202020;font-family:system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:48px 28px}h1{font-size:36px;letter-spacing:-1px;margin:0}p{color:#73706b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 0}.card{border-radius:24px;background:#fffaf3;padding:28px}.night{background:#191919;color:#fffaf3}.mark{display:block;width:210px;margin:0 auto}.lock{width:100%;height:100px}h2{font-size:14px;font-weight:500;margin:0 0 16px}.icons{display:flex;gap:24px;align-items:center}.icons img{width:42%}.sizes{display:flex;gap:26px;align-items:center;height:80px}.sizes span{display:flex;align-items:center;gap:8px;font-size:12px}.banner{width:100%;border-radius:16px}.note{font-size:13px;line-height:1.8}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style><main><h1>demo-agent</h1><p>以原始图 6 为母版 · 保留球体与三层卡片</p><div class="grid"><section class="card"><h2>母版 / 原始图 6</h2><img class="banner" src="original-icon-dark.png"></section><section class="card"><h2>轮廓对照 / 青绿色为矢量路径，含被遮挡边缘</h2><img class="banner" src="contour-overlay.svg"></section><section class="card"><h2>标准标志 / 浅色背景</h2><img class="mark" src="mark-dark.svg"><img class="lock" src="lockup-dark.svg"></section><section class="card night"><h2>标准标志 / 深色背景</h2><img class="mark" src="mark-light.svg"><img class="lock" src="lockup-light.svg"></section><section class="card"><h2>图标 / 原图比例，矢量渐变</h2><div class="icons"><img src="icon-dark.svg"><img src="icon-light.svg"></div></section><section class="card"><h2>实际小尺寸 / 保留三层</h2><div class="sizes"><span><img src="favicon.svg" width="16">16</span><span><img src="favicon.svg" width="24">24</span><span><img src="favicon.svg" width="32">32</span><span><img src="favicon.svg" width="48">48</span></div><div class="sizes"><img src="mark-small-dark.svg" width="16"><img src="mark-small-dark.svg" width="24"><img src="mark-small-dark.svg" width="32"></div><p class="note">小尺寸沿用完整三层轮廓；16 px 的层间辨识仍有限。<br>横排字标保留可编辑文字，字体尚未转轮廓。</p></section></div><section class="card"><h2>保留的原始品牌横幅</h2><img class="banner" src="original-banner.png"></section></main></html>
